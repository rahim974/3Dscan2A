<svg xmlns="http://www.w3.org/2000/svg" width="960" height="470" viewBox="0 0 960 470" role="img" aria-label="P06 | Cycle de vie et propriété"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#94a3b8"/></marker></defs><rect width="960" height="470" rx="18" fill="#101827"/><g font-family="Arial, sans-serif"><text x="32" y="43" font-size="25" fill="#e5edf7" font-weight="700" text-anchor="start">P06 | Cycle de vie et propriété</text><text x="32" y="68" font-size="15" fill="#a9b9ce" font-weight="400" text-anchor="start">Contrat implémenté ; tests API avec ticks artificiels et backend de test injecté.</text><rect x="28" y="125" width="172" height="62" rx="8" fill="#203047" stroke="#52657d"/><text x="114.0" y="151" font-size="17" fill="#e5edf7" font-weight="700" text-anchor="middle">UNINITIALIZED</text><text x="114.0" y="172" font-size="14" fill="#a9b9ce" font-weight="400" text-anchor="middle">Contexte zéro</text><rect x="211" y="125" width="172" height="62" rx="8" fill="#203047" stroke="#52657d"/><text x="297.0" y="151" font-size="17" fill="#e5edf7" font-weight="700" text-anchor="middle">IDLE</text><text x="297.0" y="172" font-size="14" fill="#a9b9ce" font-weight="400" text-anchor="middle">Buffer disponible</text><rect x="394" y="125" width="172" height="62" rx="8" fill="#203047" stroke="#52657d"/><text x="480.0" y="151" font-size="17" fill="#e5edf7" font-weight="700" text-anchor="middle">ACQUIRING</text><text x="480.0" y="172" font-size="14" fill="#a9b9ce" font-weight="400" text-anchor="middle">Backend écrit</text><rect x="577" y="125" width="172" height="62" rx="8" fill="#203047" stroke="#52657d"/><text x="663.0" y="151" font-size="17" fill="#e5edf7" font-weight="700" text-anchor="middle">READY</text><text x="663.0" y="172" font-size="14" fill="#a9b9ce" font-weight="400" text-anchor="middle">Frame publiée</text><rect x="760" y="125" width="172" height="62" rx="8" fill="#123b3d" stroke="#2dd4bf"/><text x="846.0" y="151" font-size="17" fill="#e5edf7" font-weight="700" text-anchor="middle">HELD</text><text x="846.0" y="172" font-size="14" fill="#a9b9ce" font-weight="400" text-anchor="middle">Lecture seule</text><path d="M200 156H211" fill="none" stroke="#94a3b8" stroke-width="2" marker-end="url(#a)"/><path d="M383 156H394" fill="none" stroke="#94a3b8" stroke-width="2" marker-end="url(#a)"/><path d="M566 156H577" fill="none" stroke="#94a3b8" stroke-width="2" marker-end="url(#a)"/><path d="M749 156H760" fill="none" stroke="#94a3b8" stroke-width="2" marker-end="url(#a)"/><text x="205" y="113" font-size="13" fill="#a9b9ce" font-weight="400" text-anchor="middle">Init</text><text x="388" y="113" font-size="13" fill="#a9b9ce" font-weight="400" text-anchor="middle">Échéance</text><text x="571" y="113" font-size="13" fill="#a9b9ce" font-weight="400" text-anchor="middle">COMPLETE</text><text x="754" y="113" font-size="13" fill="#a9b9ce" font-weight="400" text-anchor="middle">Acquire</text><path d="M846 187V240H297V187" fill="none" stroke="#94a3b8" stroke-width="2" marker-end="url(#a)"/><text x="570" y="231" font-size="16" fill="#e5edf7" font-weight="400" text-anchor="middle">Release → IDLE</text><rect x="340" y="300" width="280" height="62" rx="8" fill="#40252b" stroke="#f87171"/><text x="480.0" y="326" font-size="17" fill="#e5edf7" font-weight="700" text-anchor="middle">ERROR</text><text x="480.0" y="347" font-size="14" fill="#a9b9ce" font-weight="400" text-anchor="middle">Production arrêtée</text><path d="M480 187V300" fill="none" stroke="#f87171" stroke-width="2" marker-end="url(#a)"/><text x="495" y="278" font-size="14" fill="#f87171" font-weight="400" text-anchor="start">FAILED / init échoué</text><path d="M340 330H297V255" fill="none" stroke="#52657d" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#a)"/><text x="32" y="389" font-size="16" fill="#e5edf7" font-weight="400" text-anchor="start">READY / HELD : aucune écriture ; échéances manquées comptées.</text><text x="32" y="415" font-size="15" fill="#a9b9ce" font-weight="400" text-anchor="start">Init autorisé depuis ERROR ; compteurs réinitialisés si nouvelle session.</text><text x="32" y="439" font-size="15" fill="#a9b9ce" font-weight="400" text-anchor="start">Backend PENDING : poll en ACQUIRING ; les erreurs doivent arrêter les écritures.</text></g></svg>
