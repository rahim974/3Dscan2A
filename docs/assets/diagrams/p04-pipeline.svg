<svg xmlns="http://www.w3.org/2000/svg" width="960" height="530" viewBox="0 0 960 530" role="img" aria-label="P04 | Coexistence caméra / LiDAR"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#94a3b8"/></marker></defs><rect x="0" y="0" width="960" height="530" rx="18" fill="#101827" stroke="none"/><g font-family="Arial, sans-serif"><text x="32" y="43" font-size="25" font-weight="700" fill="#e5edf7" text-anchor="start">P04 | Coexistence caméra / LiDAR</text><text x="32" y="68" font-size="15" font-weight="400" fill="#a9b9ce" text-anchor="start">Architecture intégrée au build Debug et exécutée sur STM32N6570-DK.</text><rect x="260" y="90" width="440" height="65" rx="8" fill="#22344a" stroke="#52657d"/><text x="480.0" y="114" font-size="16" font-weight="700" fill="#e5edf7" text-anchor="middle">Firmware caméra existant</text><text x="480.0" y="136" font-size="13" font-weight="400" fill="#a9b9ce" text-anchor="middle">DCMIPP_ContinuousMode_FSBL</text><path d="M480 155V171H235V191" stroke="#94a3b8" stroke-width="2" fill="none" marker-end="url(#a)"/><path d="M480 155V171H725V191" stroke="#94a3b8" stroke-width="2" fill="none" marker-end="url(#a)"/><rect x="55" y="192" width="360" height="66" rx="8" fill="#173657" stroke="#4388e8"/><text x="235.0" y="216" font-size="16" font-weight="700" fill="#e5edf7" text-anchor="middle">CameraSource_Process()</text><text x="235.0" y="238" font-size="13" font-weight="400" fill="#a9b9ce" text-anchor="middle">Pipe 1 continu / LCD</text><rect x="545" y="192" width="360" height="66" rx="8" fill="#123b3d" stroke="#2dd4bf"/><text x="725.0" y="216" font-size="16" font-weight="700" fill="#e5edf7" text-anchor="middle">LidarSim_Generate()</text><text x="725.0" y="238" font-size="13" font-weight="400" fill="#a9b9ce" text-anchor="middle">Six cas / seed 1234 / buffer dédié</text><path d="M725 258V284" stroke="#94a3b8" stroke-width="2" fill="none" marker-end="url(#a)"/><rect x="545" y="285" width="360" height="66" rx="8" fill="#123b3d" stroke="#2dd4bf"/><text x="725.0" y="309" font-size="16" font-weight="700" fill="#e5edf7" text-anchor="middle">ComputeStats + P04Hash</text><text x="725.0" y="331" font-size="13" font-weight="400" fill="#a9b9ce" text-anchor="middle">Min, max, moyenne, compteurs, empreinte</text><path d="M725 351V377" stroke="#94a3b8" stroke-width="2" fill="none" marker-end="url(#a)"/><rect x="545" y="378" width="360" height="65" rx="8" fill="#123b3d" stroke="#2dd4bf"/><text x="725.0" y="402" font-size="16" font-weight="700" fill="#e5edf7" text-anchor="middle">g_p04.results[0…5]</text><text x="725.0" y="424" font-size="13" font-weight="400" fill="#a9b9ce" text-anchor="middle">Comparaison automatique aux références</text><path d="M235 258V284" stroke="#94a3b8" stroke-width="2" fill="none" marker-end="url(#a)"/><rect x="55" y="285" width="360" height="66" rx="8" fill="#173657" stroke="#4388e8"/><text x="235.0" y="309" font-size="16" font-weight="700" fill="#e5edf7" text-anchor="middle">Mesure caméra sur 5 secondes</text><text x="235.0" y="331" font-size="13" font-weight="400" fill="#a9b9ce" text-anchor="middle">151 frames produites / 151 lues</text><path d="M235 351V377" stroke="#94a3b8" stroke-width="2" fill="none" marker-end="url(#a)"/><rect x="55" y="378" width="360" height="65" rx="8" fill="#173657" stroke="#4388e8"/><text x="235.0" y="402" font-size="16" font-weight="700" fill="#e5edf7" text-anchor="middle">LCD et cadence préservés</text><text x="235.0" y="424" font-size="13" font-weight="400" fill="#a9b9ce" text-anchor="middle">30,20 FPS ; image confirmée</text><text x="32" y="480" font-size="14" font-weight="400" fill="#a9b9ce" text-anchor="start">Test automatique snapshot P03 désactivé à la compilation ; API et réservation conservées.</text><text x="32" y="504" font-size="14" font-weight="400" fill="#a9b9ce" text-anchor="start">Aucun appariement RGB-D, aucune acquisition LiDAR physique.</text></g></svg>
