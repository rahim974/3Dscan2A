<svg xmlns="http://www.w3.org/2000/svg" width="960" height="430" viewBox="0 0 960 430" role="img" aria-label="P05 | Seuillage des distances"><rect width="960" height="430" rx="18" fill="#101827"/><g font-family="Arial, sans-serif"><text x="32" y="43" font-size="25" fill="#e5edf7" font-weight="700" text-anchor="start">P05 | Seuillage des distances</text><text x="32" y="68" font-size="15" fill="#a9b9ce" font-weight="400" text-anchor="start">Convention du module ; exemples théoriques au seuil 1500 mm.</text><rect x="35" y="104" width="280" height="68" rx="8" fill="#203047" stroke="#64748b"/><text x="175.0" y="129" font-size="17" fill="#e5edf7" font-weight="700" text-anchor="middle">Distance d[r][c]</text><text x="175.0" y="151" font-size="13" fill="#a9b9ce" font-weight="400" text-anchor="middle">uint16_t, millimètres</text><rect x="340" y="104" width="280" height="68" rx="8" fill="#203047" stroke="#2dd4bf"/><text x="480.0" y="129" font-size="17" fill="#e5edf7" font-weight="700" text-anchor="middle">Validité</text><text x="480.0" y="151" font-size="13" fill="#a9b9ce" font-weight="400" text-anchor="middle">d ≠ 65535</text><rect x="645" y="104" width="280" height="68" rx="8" fill="#203047" stroke="#2dd4bf"/><text x="785.0" y="129" font-size="17" fill="#e5edf7" font-weight="700" text-anchor="middle">Seuil strict</text><text x="785.0" y="151" font-size="13" fill="#a9b9ce" font-weight="400" text-anchor="middle">d &lt; S</text><path d="M315 138 H340 M620 138 H645" stroke="#a9b9ce" stroke-width="2"/><rect x="35" y="210" width="210" height="72" rx="8" fill="#203047" stroke="#2dd4bf"/><text x="140.0" y="235" font-size="17" fill="#e5edf7" font-weight="700" text-anchor="middle">1499 mm</text><text x="140.0" y="257" font-size="13" fill="#a9b9ce" font-weight="400" text-anchor="middle">proche</text><rect x="261" y="210" width="210" height="72" rx="8" fill="#203047" stroke="#64748b"/><text x="366.0" y="235" font-size="17" fill="#e5edf7" font-weight="700" text-anchor="middle">1500 mm</text><text x="366.0" y="257" font-size="13" fill="#a9b9ce" font-weight="400" text-anchor="middle">exclue</text><rect x="487" y="210" width="210" height="72" rx="8" fill="#203047" stroke="#64748b"/><text x="592.0" y="235" font-size="17" fill="#e5edf7" font-weight="700" text-anchor="middle">1501 mm</text><text x="592.0" y="257" font-size="13" fill="#a9b9ce" font-weight="400" text-anchor="middle">exclue</text><rect x="713" y="210" width="210" height="72" rx="8" fill="#203047" stroke="#64748b"/><text x="818.0" y="235" font-size="17" fill="#e5edf7" font-weight="700" text-anchor="middle">65535 mm</text><text x="818.0" y="257" font-size="13" fill="#a9b9ce" font-weight="400" text-anchor="middle">invalide</text><text x="35" y="330" font-size="18" fill="#e5edf7" font-weight="700" text-anchor="start">Sortie : N, minimum, moyenne entière, centroïde (ligne, colonne), detected</text><text x="35" y="365" font-size="16" fill="#a9b9ce" font-weight="400" text-anchor="start">Sans détection : N=0, min=65535, moyenne=0, centroïde=(0,0).</text><text x="35" y="395" font-size="16" fill="#a9b9ce" font-weight="400" text-anchor="start">Indices à partir de zéro ; centroïde non pondéré ; seuil nominal S=1500 mm.</text></g></svg>
