<svg xmlns="http://www.w3.org/2000/svg" width="960" height="450" viewBox="0 0 960 450" role="img" aria-label="P03 | Propriété du snapshot">
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#94a3b8"/></marker></defs>
<rect width="960" height="450" rx="18" fill="#101827"/>
<g font-family="Arial, sans-serif" fill="#e5edf7"><text x="32" y="43" font-size="25" font-weight="700">P03 | Propriété du snapshot</text><text x="32" y="68" font-size="15" fill="#a9b9ce">Machine à états effective, consommateur unique en boucle principale.</text><rect x="26" y="122" width="160" height="65" rx="8" fill="#1d2c40" stroke="#52657d"/><text x="106.0" y="149" font-size="18" fill="#e5edf7" text-anchor="middle" font-weight="700">FREE</text><text x="106.0" y="171" font-size="14" fill="#b7c8dc" text-anchor="middle" font-weight="400">Disponible</text><path d="M186 154H211" stroke="#94a3b8" stroke-width="2" fill="none" marker-end="url(#a)"/><rect x="213" y="122" width="160" height="65" rx="8" fill="#1d2c40" stroke="#52657d"/><text x="293.0" y="149" font-size="18" fill="#e5edf7" text-anchor="middle" font-weight="700">CAPTURING</text><text x="293.0" y="171" font-size="14" fill="#b7c8dc" text-anchor="middle" font-weight="400">DCMIPP écrit</text><path d="M373 154H398" stroke="#94a3b8" stroke-width="2" fill="none" marker-end="url(#a)"/><rect x="400" y="122" width="160" height="65" rx="8" fill="#1d2c40" stroke="#52657d"/><text x="480.0" y="149" font-size="18" fill="#e5edf7" text-anchor="middle" font-weight="700">COMPLETE</text><text x="480.0" y="171" font-size="14" fill="#b7c8dc" text-anchor="middle" font-weight="400">Fin de frame</text><path d="M560 154H585" stroke="#94a3b8" stroke-width="2" fill="none" marker-end="url(#a)"/><rect x="587" y="122" width="160" height="65" rx="8" fill="#1d2c40" stroke="#52657d"/><text x="667.0" y="149" font-size="18" fill="#e5edf7" text-anchor="middle" font-weight="700">READY</text><text x="667.0" y="171" font-size="14" fill="#b7c8dc" text-anchor="middle" font-weight="400">Cache invalidé</text><path d="M747 154H772" stroke="#94a3b8" stroke-width="2" fill="none" marker-end="url(#a)"/><rect x="774" y="122" width="160" height="65" rx="8" fill="#123b3d" stroke="#2dd4bf"/><text x="854.0" y="149" font-size="18" fill="#e5edf7" text-anchor="middle" font-weight="700">HELD</text><text x="854.0" y="171" font-size="14" fill="#b7c8dc" text-anchor="middle" font-weight="400">Lecture CPU seule</text><path d="M854 187V237H106V187" stroke="#94a3b8" stroke-width="2" fill="none" marker-end="url(#a)"/><text x="480" y="230" font-size="16" fill="#e5edf7" text-anchor="middle" font-weight="400">ReleaseSnapshot() — retour à FREE si aucune erreur</text><rect x="330" y="300" width="300" height="65" rx="8" fill="#40252b" stroke="#f87171"/><text x="480.0" y="327" font-size="18" fill="#e5edf7" text-anchor="middle" font-weight="700">ERROR</text><text x="480.0" y="349" font-size="14" fill="#b7c8dc" text-anchor="middle" font-weight="400">Pas de nouvelle capture</text><path d="M293 187V267H480V299" stroke="#94a3b8" stroke-width="2" fill="none" marker-end="url(#a)"/><text x="32" y="393" font-size="14" fill="#b7c8dc" text-anchor="start" font-weight="400">CAPTURING / COMPLETE / READY / FREE : défaut → ERROR ; HELD : propriété conservée jusqu’à Release.</text><text x="32" y="417" font-size="14" fill="#b7c8dc" text-anchor="start" font-weight="400">Exception : DPHY CTRL initial journalisé et contrôles matériels avant la première demande.</text></g></svg>
